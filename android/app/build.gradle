apply plugin: 'com.android.application'

android {
    namespace 'com.spotifytool.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.spotifytool.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // Fixed keystore so updates install in place (same discipline as the
    // Hour Tracker app: never regenerate, never tell the user to uninstall).
    // The keystore is NOT committed (open-source hygiene) — generate your own
    // once and keep it forever:
    //   keytool -genkeypair -keystore spotifytool.keystore -alias spotifytool \
    //     -storepass android -keypass android -keyalg RSA -validity 10000 \
    //     -dname CN=spotifytool
    // Without one, builds fall back to the default debug signing.
    def stableKeystore = file('spotifytool.keystore')
    signingConfigs {
        if (stableKeystore.exists()) {
            stable {
                storeFile stableKeystore
                storePassword 'android'
                keyAlias 'spotifytool'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
        }
        release {
            if (stableKeystore.exists()) signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
